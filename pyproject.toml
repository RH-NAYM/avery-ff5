[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "livekit-agent"
version = "1.0.0"
description = "Single prompt voice AI agent built with LiveKit Agents for Python"
requires-python = ">=3.10"

dependencies = [
    "livekit-agents>=1.6.9,<2",
    "livekit-plugins-ai-coustics~=0.2",
    "livekit-plugins-noise-cancellation~=0.2",
    "livekit-plugins-deepgram~=1.7",
    "livekit-plugins-cartesia~=1.7",
    "livekit-plugins-google~=1.7",
    "livekit-plugins-elevenlabs~=1.7",
    "livekit-plugins-openai~=1.7",
    "livekit-plugins-silero~=1.7",
    "livekit-plugins-turn-detector~=1.7",
    "python-dotenv",
    "python-handlebars"
]

[project.optional-dependencies]
# Coqui XTTS v2 (local TTS provider). Not installed by default: torch is a
# large, hardware-specific (CPU/CUDA) dependency, so it's installed
# separately per the "Coqui XTTS v2 (local)" section in README.md, typically
# into a dedicated conda environment rather than via `uv sync`.
coqui = [
    "coqui-tts>=0.27,<0.28",
    "transformers>=4.57,<5",
    "torchcodec>=0.8",  # required by torch>=2.9 for audio I/O
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP", "SIM", "RUF"]
ignore = ["E501", "W291", "RUF001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
